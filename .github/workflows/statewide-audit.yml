name: dealscan-source-discovery

on:
  workflow_dispatch:
    inputs:
      states:
        description: 'Comma-separated states to research; discoveries are not ETL authorization'
        type: string
        default: 'North Carolina,Florida,Washington'
      discovery_limit:
        description: 'Maximum county discoveries, 0–100'
        type: string
        default: '10'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEALSCAN_DB_BACKEND: sqlite
      DEALSCAN_REGISTRY_PATH: data/research-counties.json
      STATES: ${{ inputs.states }}
      DISCOVERY_LIMIT: ${{ inputs.discovery_limit }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.lock.txt
      - name: Install dependencies
        run: pip install -r requirements.lock.txt
      - name: Load official county geography
        run: python main.py --refresh-universe
      - name: Read-only source research (no ETL or publication)
        run: python main.py --statewide-audit --states "$STATES" --discovery-limit "$DISCOVERY_LIMIT" --etl-limit 0 --report-file data/source-research-summary.json
      - name: Upload minimized source research report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: source-research-${{ github.run_id }}
          path: pipeline/data/source-research-summary.json
          if-no-files-found: ignore
          retention-days: 7
