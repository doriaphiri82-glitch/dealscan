name: county-source-smoke

on:
  workflow_dispatch:
    inputs:
      max_records:
        description: 'Maximum public records to inspect per county (1-250)'
        required: false
        default: '25'
  push:
    branches: [feat/openai-deal-intelligence]
    paths:
      - 'pipeline/scripts/county_source_smoke.py'
      - 'pipeline/scrapers/arcgis.py'
      - 'pipeline/scrapers/counties.py'
      - 'pipeline/config/counties.py'
      - '.github/workflows/county-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install pipeline dependencies
        working-directory: pipeline
        run: pip install -r requirements.txt
      - name: Run read-only county source smoke checks
        env:
          MAX_RECORDS: ${{ inputs.max_records || '25' }}
        run: PYTHONPATH=pipeline python pipeline/scripts/county_source_smoke.py --max-records "$MAX_RECORDS"
