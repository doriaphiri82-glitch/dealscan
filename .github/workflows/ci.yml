name: dealscan-ci

on:
  push:
    branches: [main, 'arena/**']
    paths: ['pipeline/**', 'landing/**', 'supabase/**', '.github/workflows/**', 'pytest.ini']
  pull_request:
    paths: ['pipeline/**', 'landing/**', 'supabase/**', '.github/workflows/**', 'pytest.ini']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealscan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.lock.txt
      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.lock.txt
      - name: Compile Python modules
        run: python -m compileall -q pipeline
      - name: Run pipeline tests
        env:
          DEALSCAN_DB_BACKEND: sqlite
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Test web and database security
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build web app
        run: npm run build
      - name: Audit web dependencies
        run: npm audit --audit-level=high
