name: dealscan-ci

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'landing/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/scrape.yml'
      - '.github/workflows/statewide-audit.yml'
  pull_request:
    paths:
      - 'pipeline/**'
      - 'landing/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/scrape.yml'
      - '.github/workflows/statewide-audit.yml'

permissions:
  contents: read

concurrency:
  group: dealscan-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate workflow YAML
        run: |
          python -m pip install --disable-pip-version-check --no-input pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('.github/workflows').glob('*.yml'):
              with path.open(encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print(f'valid: {path}')
          PY

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install pipeline dependencies
        working-directory: pipeline
        run: pip install -r requirements.txt pytest
      - name: Compile Python modules
        run: python -m compileall -q pipeline
      - name: Run pipeline tests
        working-directory: pipeline
        env:
          PYTHONPATH: .
        run: pytest -q tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
