name: dealscan-pipeline

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '30 5 * * *'
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      discover_limit:
        description: 'Maximum new counties to discover'
        required: false
        default: '25'
      run_limit:
        description: 'Maximum discovered counties to ETL'
        required: false
        default: '10'

permissions:
  contents: write

concurrency:
  group: dealscan-national-pipeline
  cancel-in-progress: false

jobs:
  national:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install dependencies
        working-directory: pipeline
        run: pip install -r requirements.txt
      - name: Run pipeline tests
        working-directory: pipeline
        run: pytest -q
      - name: Initialize database
        working-directory: pipeline
        run: python main.py --setup-db
      - name: Discover national sources
        working-directory: pipeline
        env:
          DISCOVER_LIMIT: ${{ github.event.inputs.discover_limit || '25' }}
        run: python main.py --discover-national "$DISCOVER_LIMIT"
      - name: Run national ETL batch
        working-directory: pipeline
        env:
          RUN_LIMIT: ${{ github.event.inputs.run_limit || '10' }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: python main.py --run-national "$RUN_LIMIT" --max-records 5000
      - name: Publish live bundle
        id: publish_live
        working-directory: pipeline
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REQUIRE_LIVE_PUBLISH: '1'
        run: python publish_live.py
      - name: Show coverage
        working-directory: pipeline
        run: python main.py --coverage
      - name: Publish web data fallback
        run: |
          mkdir -p landing/data
          cp -f pipeline/data/bundle.json landing/data/bundle.json
          cp -f pipeline/config/counties/registry.json landing/data/registry.json
      - name: Commit pipeline data artifacts
        run: |
          git config user.name "DealScan Pipeline"
          git config user.email "pipeline@dealscan.app"
          git add -f pipeline/data/registry.json pipeline/data/bundle.json landing/data/bundle.json landing/data/registry.json
          if git diff --cached --quiet; then
            echo "No pipeline data changes to commit."
          else
            git commit -m "chore: national pipeline refresh $(date -u +%F-%H%M)"
            git push origin HEAD:main
          fi
