name: dealscan-pipeline

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      county_id:
        description: 'Exact reviewed county to ingest (start with one pilot)'
        type: string
        default: el_paso_tx
        required: true
      max_records:
        description: 'Record cap, 1–5000; use 250 for first production validation'
        type: string
        default: '250'
        required: true

permissions:
  contents: read

# Shares a lock with the production smoke workflow; neither cancels primary writes.
concurrency:
  group: dealscan-production-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    # Deliberate rollout gate: enable cron only after a real production smoke pass.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_PRODUCTION_INGESTION == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      DEALSCAN_ENV: production
      DEALSCAN_DB_BACKEND: supabase
      DEALSCAN_REGISTRY_PATH: data/counties.json
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COUNTY_ID: ${{ inputs.county_id || 'el_paso_tx' }}
      MAX_RECORDS: ${{ inputs.max_records || '250' }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.lock.txt
      - name: Install dependencies
        run: pip install -r requirements.lock.txt
      - name: Verify production configuration
        run: |
          test -n "$SUPABASE_URL" || { echo 'Missing SUPABASE_URL secret'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'Missing SUPABASE_SERVICE_ROLE_KEY secret'; exit 1; }
      - name: Run pipeline tests
        working-directory: pipeline
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
      - name: Verify migrated schema
        run: python main.py --setup-db
      - name: Live-validate the exact source
        run: python main.py --validate-live 1 --county "$COUNTY_ID"
      - name: Explicitly authorize validated and reviewed source
        run: python main.py --authorize-county "$COUNTY_ID"
      - name: Bounded Supabase ingestion
        run: python main.py --run --etl-only --county "$COUNTY_ID" --max-records "$MAX_RECORDS" --report-file data/ingestion-summary.json
      - name: Verify this run's persisted source chain
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from validation.production_smoke import verify_ingestion
          summary = json.loads(Path('data/ingestion-summary.json').read_text())
          result = summary['results'][0]
          checked = verify_ingestion(result['audit_run_id'], county_id=os.environ['COUNTY_ID'], max_records=int(os.environ['MAX_RECORDS']))
          Path('data/ingestion-check.json').write_text(json.dumps(checked, indent=2))
          print(json.dumps(checked))
          PY
      - name: Upload minimized operational summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: ingestion-summary-${{ github.run_id }}
          path: |
            pipeline/data/ingestion-summary.json
            pipeline/data/ingestion-check.json
          if-no-files-found: ignore
          retention-days: 7
