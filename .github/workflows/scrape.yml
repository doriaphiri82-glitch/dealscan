name: dealscan-pipeline

on:
  schedule:
    # Every 6 minutes — frequent delta scrape + publish
    - cron: '*/6 * * * *'
    # Daily (06:30 UTC) — delta scrape + publish
    - cron: '30 6 * * *'
    # Weekly full scrape (Mon 02:00 UTC) — deep refresh
    - cron: '0 2 * * 1'
  workflow_dispatch:      # manual trigger

env:
  PYTHONDONTWRITEBYTECODE: '1'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Run the currently configured/verified pilot counties. The national
        # expansion registry remains the source of truth for future batches;
        # unverified candidates must be probed before entering production.
        county: [cochise_az, mohave_az, el_paso_tx]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        working-directory: pipeline
        run: pip install -r requirements.txt

      - name: Initialize DB
        working-directory: pipeline
        run: python main.py --setup-db || true

      - name: Run county scraper
        working-directory: pipeline
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: python scheduler.py --county ${{ matrix.county }}

      - name: Upload run registry artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-registry-${{ matrix.county }}
          path: pipeline/data/registry.json
          retention-days: 14

  publish:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        working-directory: pipeline
        run: pip install -r requirements.txt

      - name: Show published bundle summary
        working-directory: pipeline
        run: python main.py --bundle || true

      - name: Publish bundle for webapp
        working-directory: pipeline
        run: |
          cp -f data/bundle.json ../landing/data/bundle.json || true
          cp -f data/registry.json ../landing/data/registry.json || true

      - name: Commit pipeline data artifacts
        if: always()
        run: |
          git config user.name "DealScan Pipeline"
          git config user.email "pipeline@dealscan.app"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add -f pipeline/data/registry.json pipeline/data/bundle.json \
                   landing/data/bundle.json landing/data/registry.json || true
          git commit -m "chore: pipeline run $(date -u +%F-%H%M)" || echo "no changes to commit"
          git push origin HEAD:main || echo "push skipped (artifact only)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
