name: dealscan-pipeline

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      discover_limit:
        description: 'Maximum new counties to discover'
        required: false
        default: '50'
      validate_live_limit:
        description: 'Maximum counties to live-validate'
        required: false
        default: '50'
      run_limit:
        description: 'Maximum validated counties to ETL'
        required: false
        default: '20'

permissions:
  contents: write

concurrency:
  group: dealscan-national-pipeline
  cancel-in-progress: false

jobs:
  national:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEALSCAN_DB_BACKEND: supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install dependencies
        working-directory: pipeline
        run: pip install -r requirements.txt pytest
      - name: Verify production database configuration
        working-directory: pipeline
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import os
          required = ("SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY")
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          print("Supabase production backend configured")
          PY
      - name: Run pipeline tests
        working-directory: pipeline
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Initialize database
        working-directory: pipeline
        run: python main.py --setup-db
      - name: Validate every registered county configuration
        working-directory: pipeline
        run: python main.py --validate
      - name: Discover national sources
        working-directory: pipeline
        env:
          DISCOVER_LIMIT: ${{ github.event.inputs.discover_limit || '50' }}
        run: python main.py --discover-national "$DISCOVER_LIMIT"
      - name: Live-validate national sources
        working-directory: pipeline
        env:
          VALIDATE_LIVE_LIMIT: ${{ github.event.inputs.validate_live_limit || '50' }}
        run: python main.py --validate-live "$VALIDATE_LIVE_LIMIT"
      - name: Run national ETL batch
        working-directory: pipeline
        env:
          RUN_LIMIT: ${{ github.event.inputs.run_limit || '20' }}
        run: python main.py --run-national "$RUN_LIMIT" --max-records 5000
      - name: Publish optional live bundle
        id: publish_live
        working-directory: pipeline
        continue-on-error: true
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REQUIRE_LIVE_PUBLISH: '0'
        run: python publish_live.py
      - name: Show coverage
        working-directory: pipeline
        run: python main.py --coverage
      - name: Commit pipeline data and national registry artifacts
        run: |
          git config user.name "DealScan Pipeline"
          git config user.email "pipeline@dealscan.app"
          git add -f pipeline/data/registry.json pipeline/data/bundle.json pipeline/config/counties/registry.json
          if git diff --cached --quiet; then
            echo "No pipeline data changes to commit."
          else
            git commit -m "chore: national pipeline refresh $(date -u +%F-%H%M)"
            git push origin HEAD:main
          fi
