name: dealscan-pipeline

on:
  schedule:
    # Daily (06:30 UTC) — delta scrape + publish
    - cron: '30 6 * * *'
    # Weekly full scrape (Mon 02:00 UTC) — deep refresh
    - cron: '0 2 * * 1'
  workflow_dispatch:      # manual trigger

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        working-directory: pipeline
        run: pip install -r requirements.txt

      - name: Initialize DB
        working-directory: pipeline
        run: python main.py --setup-db || true

      - name: Probe county data sources
        working-directory: pipeline
        run: python main.py --probe

      - name: Run county scrapers
        working-directory: pipeline
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: python scheduler.py --run-once

      - name: Show published bundle summary
        working-directory: pipeline
        run: python main.py --bundle || true

      - name: Publish bundle for webapp
        working-directory: pipeline
        run: |
          cp -f data/bundle.json ../landing/data/bundle.json || true
          cp -f data/registry.json ../landing/data/registry.json || true

      - name: Commit pipeline data artifacts
        run: |
          git config user.name "DealScan Pipeline"
          git config user.email "pipeline@dealscan.app"
          git add -f pipeline/data/registry.json pipeline/data/bundle.json \
                   landing/data/bundle.json landing/data/registry.json || true
          git commit -m "chore: pipeline run $(date -u +%F-%H%M)" || echo "no changes to commit"
          git push origin main || echo "push skipped (artifact only)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}