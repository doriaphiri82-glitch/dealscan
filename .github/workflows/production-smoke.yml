name: dealscan-production-smoke

on:
  # Read-only handoff evidence for this trusted session branch. This trigger
  # cannot select the write step and still honors environment protection rules.
  # Each new Arena session branch retargets this pin to itself explicitly.
  push:
    branches: ['arena/01a07d76-dealscan']
  workflow_dispatch:
    inputs:
      county_id:
        description: 'Exact reviewed pilot county (no synthetic records are inserted)'
        required: true
        default: el_paso_tx
        type: string
      max_records:
        description: 'Bounded real records, 1–5000; start with 250'
        required: true
        default: '250'
        type: string
      app_url:
        description: 'Actual deployed HTTPS application origin'
        required: true
        type: string
      preflight_only:
        description: 'Read-only readiness checks only; no authorization, ingestion or migrations'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: dealscan-production-ingestion
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      DEALSCAN_ENV: production
      DEALSCAN_DB_BACKEND: supabase
      DEALSCAN_REGISTRY_PATH: data/counties.json
      WAITLIST_CONTACT_EMAIL: doriaphiri82@gmail.com
      PRODUCTION_APP_URL: ${{ inputs.app_url || 'https://dealscan-omega.vercel.app' }}
      COUNTY_ID: ${{ inputs.county_id || 'el_paso_tx' }}
      MAX_RECORDS: ${{ inputs.max_records || '250' }}
      # Management credentials are not injected merely to check their presence.
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
      HAS_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      HAS_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.lock.txt
      - name: Install dependencies
        run: pip install -r requirements.lock.txt
      - name: Read-only production readiness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: python -m validation.production_preflight --county "$COUNTY_ID" --max-records "$MAX_RECORDS" --app-url "$PRODUCTION_APP_URL" --report-file data/readiness-summary.json
      - name: Resolve and record the dispatch intent
        # Run 34161918861 was dispatched for the bounded chain, the write step
        # evaluated to skipped, and the run still finished green — the operator
        # had no way to see which way the gate went. The resolved decision is
        # now printed and annotated on every run. No secret is echoed.
        run: |
          set -euo pipefail
          echo "event=${{ github.event_name }}"
          echo "county_id=$COUNTY_ID max_records=$MAX_RECORDS app_url=$PRODUCTION_APP_URL"
          echo "preflight_only(typed)=${{ format('{0}', inputs.preflight_only) }}"
          echo "preflight_only(payload)=${{ format('{0}', github.event.inputs.preflight_only) }}"
          echo "authorized_write_path=${{ github.event_name == 'workflow_dispatch' && (format('{0}', inputs.preflight_only) == 'false' || format('{0}', github.event.inputs.preflight_only) == 'false') }}"
          echo "::notice title=Dispatch intent::event=${{ github.event_name }} preflight_only=${{ format('{0}', inputs.preflight_only) }} authorized_write_path=${{ github.event_name == 'workflow_dispatch' && (format('{0}', inputs.preflight_only) == 'false' || format('{0}', github.event.inputs.preflight_only) == 'false') }} county=$COUNTY_ID max_records=$MAX_RECORDS"
      - name: Validate, authorize, ingest, and verify the complete current-run chain
        id: chain
        # Stricter than the previous boolean-negation form: only the exact
        # literal false enables writes, in either the typed input context or the
        # raw event payload (a boolean input reaches them differently depending
        # on how the dispatch was made). Anything else — missing, empty, 'true',
        # a typo — stays read-only, and a push event can never reach this step.
        if: ${{ github.event_name == 'workflow_dispatch' && (format('{0}', inputs.preflight_only) == 'false' || format('{0}', github.event.inputs.preflight_only) == 'false') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: python main.py --production-smoke "$COUNTY_ID" --max-records "$MAX_RECORDS" --app-url "$PRODUCTION_APP_URL" --report-file data/smoke-summary.json
      - name: A dispatched write must not silently skip
        # An authorized dispatch that produces no chain evidence is a failure,
        # never a green read-only run. This guard reads the raw payload as well
        # as the typed input, so a gate that misreads the operator's intent is
        # caught instead of being reported as success.
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          typed='${{ format('{0}', inputs.preflight_only) }}'
          payload='${{ format('{0}', github.event.inputs.preflight_only) }}'
          outcome='${{ steps.chain.outcome }}'
          if [ "$typed" = "false" ] || [ "$payload" = "false" ]; then
            if [ ! -s data/smoke-summary.json ]; then
              echo "::error title=Authorized bounded smoke did not run::preflight_only was dispatched as false (typed=$typed payload=$payload) but the chain step outcome was '$outcome' and no smoke-summary.json exists. Nothing was ingested; this run is not evidence of a successful chain."
              exit 1
            fi
            echo "Chain step outcome=$outcome; smoke summary present."
          else
            echo "Read-only dispatch (typed=$typed payload=$payload); chain intentionally not run."
          fi
      - name: Upload minimized readiness and smoke summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: production-smoke-${{ github.run_id }}
          path: |
            pipeline/data/readiness-summary.json
            pipeline/data/smoke-summary.json
          if-no-files-found: warn
          retention-days: 7
