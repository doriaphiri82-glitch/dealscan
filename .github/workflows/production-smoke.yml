name: dealscan-production-smoke

on:
  workflow_dispatch:
    inputs:
      county_id:
        description: 'Exact reviewed pilot county (no synthetic records are inserted)'
        required: true
        default: el_paso_tx
        type: string
      max_records:
        description: 'Bounded real records, 1–5000'
        required: true
        default: '250'
        type: string
      app_url:
        description: 'Actual deployed HTTPS application origin'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dealscan-production-ingestion
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      DEALSCAN_ENV: production
      DEALSCAN_DB_BACKEND: supabase
      DEALSCAN_REGISTRY_PATH: data/counties.json
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PRODUCTION_APP_URL: ${{ inputs.app_url }}
      COUNTY_ID: ${{ inputs.county_id }}
      MAX_RECORDS: ${{ inputs.max_records }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.lock.txt
      - name: Install dependencies
        run: pip install -r requirements.lock.txt
      - name: Verify production configuration
        run: |
          test -n "$SUPABASE_URL" || { echo 'Missing SUPABASE_URL secret'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'Missing SUPABASE_SERVICE_ROLE_KEY secret'; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY$SUPABASE_ANON_KEY" || { echo 'A public Supabase key is required for RLS verification'; exit 1; }
      - name: Verify migrated schema
        run: python main.py --setup-db
      - name: Validate, authorize, ingest, and verify the complete current-run chain
        run: python main.py --production-smoke "$COUNTY_ID" --max-records "$MAX_RECORDS" --app-url "$PRODUCTION_APP_URL" --report-file data/smoke-summary.json
      - name: Upload minimized smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_id }}
          path: pipeline/data/smoke-summary.json
          if-no-files-found: ignore
          retention-days: 7
