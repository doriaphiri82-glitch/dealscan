name: dealscan-supabase-handoff

on:
  # Inspects the real Supabase project and applies reviewed ordered migrations.
  # Migrations are sourced from refs/heads/main (never from this unmerged
  # branch), each idempotent file is applied at most once in timestamp order,
  # the run stops at the first failure/inconsistency with a before/after
  # logical snapshot, and no existing object is dropped or recreated.
  push:
    branches: ['arena/01a0759b-dealscan']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealscan-supabase-handoff
  cancel-in-progress: false

jobs:
  supabase:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.lock.txt
      - name: Install dependencies
        run: pip install -r requirements.lock.txt
      - name: Materialize migrations only from the reviewed main branch
        working-directory: .
        run: |
          git fetch --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/main-migrations"
          for path in $(git ls-tree -r --name-only FETCH_HEAD supabase/migrations/); do
            git show "FETCH_HEAD:$path" > "$RUNNER_TEMP/main-migrations/$(basename "$path")"
          done
          ls -1 "$RUNNER_TEMP/main-migrations"
          echo "DEALSCAN_MIGRATIONS_DIR=$RUNNER_TEMP/main-migrations" >> "$GITHUB_ENV"
      - name: Inspect, snapshot, apply reviewed ordered migrations, verify Auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PRODUCTION_APP_URL: https://dealscan-omega.vercel.app
        run: |
          python -m validation.supabase_handoff --apply \
            --app-url "$PRODUCTION_APP_URL" \
            --report-file data/supabase-handoff.json
      - name: Upload minimized Supabase handoff summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: supabase-handoff-${{ github.run_id }}
          path: pipeline/data/supabase-handoff.json
          if-no-files-found: warn
          retention-days: 7
