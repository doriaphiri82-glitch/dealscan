name: dealscan-supabase-handoff

on:
  # Inspects the real Supabase project and applies reviewed ordered migrations.
  # Migrations are sourced from refs/heads/main (never from this unmerged
  # branch), each idempotent file is applied at most once in timestamp order,
  # the run stops at the first failure/inconsistency with a before/after
  # logical snapshot, and no existing object is dropped or recreated.
  push:
    branches: ['arena/01a07d76-dealscan']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealscan-supabase-handoff
  cancel-in-progress: false

jobs:
  supabase:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.lock.txt
      - name: Install dependencies
        run: pip install -r requirements.lock.txt
      - name: Materialize migrations only from the reviewed main branch
        working-directory: .
        run: |
          git fetch --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/main-migrations"
          for path in $(git ls-tree -r --name-only FETCH_HEAD supabase/migrations/); do
            git show "FETCH_HEAD:$path" > "$RUNNER_TEMP/main-migrations/$(basename "$path")"
          done
          ls -1 "$RUNNER_TEMP/main-migrations"
          echo "DEALSCAN_MIGRATIONS_DIR=$RUNNER_TEMP/main-migrations" >> "$GITHUB_ENV"
      - name: Derive the IPv4 Session Pooler DSN for PostgreSQL access
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # The project ref lets a plain "postgres" username be tenant-qualified
          # to postgres.<ref>, which Supavisor requires for routing.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Pinned: this project lives in eu-west-1 and its Supavisor endpoint
          # is the aws-1 shard (observed live in run 34158289491). Runners are
          # IPv4-only while db.<ref>.supabase.co is IPv6-only without the paid
          # IPv4 add-on, so pg_dump/psql must go through the SESSION pooler
          # (port 5432 — transaction mode 6543 cannot serve pg_dump).
          DEALSCAN_SUPABASE_REGION: eu-west-1
          DEALSCAN_SUPABASE_POOLER_SHARD: aws-1
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/data"
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::warning::SUPABASE_DB_URL not configured; no pooler DSN derived"
            exit 0
          fi
          # --diagnose writes a credential-free shape report (host class, port,
          # whether the username is tenant-qualified, whether the password is
          # percent-encoded or still the dashboard placeholder) so an auth
          # failure is attributable without ever printing a value.
          # --emit-mask registers the derived DSN with ::add-mask:: before the
          # capture below can put it anywhere near stdout.
          if ! python -m validation.supabase_pooler_url --emit-mask \
              --diagnose "$GITHUB_WORKSPACE/data/supabase-dsn-diagnosis.json"; then
            echo "::warning::Session Pooler DSN not derived; the backup step falls back to SUPABASE_DB_URL as stored"
            exit 0
          fi
          echo "SUPABASE_DB_POOLER_DSN=$(python -m validation.supabase_pooler_url --dsn)" >> "$GITHUB_ENV"
      - name: Physical schema backup before any application (pg_dump, schema-only + counts)
        working-directory: .
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p data
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "skipped_no_secret" > data/supabase-backup-status.txt
            echo "::warning::SUPABASE_DB_URL not configured; physical backup skipped (logical snapshot still recorded)"
          else
            # IPv4 Session Pooler when it could be derived, otherwise the secret
            # exactly as stored. Endpoint mode (host only, never credentials) is
            # recorded so a failure is attributable.
            DB_DSN="${SUPABASE_DB_POOLER_DSN:-$SUPABASE_DB_URL}"
            if [ -n "${SUPABASE_DB_POOLER_DSN:-}" ]; then
              echo "derived_session_pooler_dsn" > data/supabase-backup-endpoint.txt
            else
              echo "supabase_db_url_as_stored" > data/supabase-backup-endpoint.txt
            fi
            cat data/supabase-backup-endpoint.txt
            # Schema-only: never export row content into an artifact. Counts only.
            # stderr is credential-redacted and never printed to the console —
            # only a short excerpt lands in the artifact for operator diagnosis.
            if pg_dump "$DB_DSN" --schema-only --no-owner --no-privileges \
              --schema=public --schema=supabase_migrations \
              -f data/supabase-schema-backup.sql \
              2> >(sed -E 's|://[^/@:]+(:[^/@]*)?@|://REDACTED@|g' | head -c 400 > data/supabase-backup-error.txt); then
              code_dump=0
            else
              code_dump=$?
            fi
            if [ "$code_dump" -eq 0 ]; then
              TABLES="counties properties deals comps subscribers deliveries waitlist ingestion_runs ingestion_records waitlist_request_limits"
              : > data/supabase-counts-backup.txt
              ok=1
              for t in $TABLES; do
                if c=$(psql "$DB_DSN" -Atc "select count(*) from public.$t" 2>/dev/null); then
                  echo "$t=$c" >> data/supabase-counts-backup.txt
                else
                  echo "$t=unavailable" >> data/supabase-counts-backup.txt; ok=0
                fi
              done
              wc -l data/supabase-schema-backup.sql
              cat data/supabase-counts-backup.txt
              if [ "$ok" -eq 1 ]; then echo "ok" > data/supabase-backup-status.txt; else
                echo "counts_partial" > data/supabase-backup-status.txt
                echo "::warning::pg_dump schema backup succeeded but some table counts were unavailable."
              fi
            else
              echo "failed_exit_$code_dump" > data/supabase-backup-status.txt
              first_line=$(head -1 data/supabase-backup-error.txt | cut -c1-200 || true)
              echo "::warning::Physical pg_dump backup failed (exit $code_dump). $first_line [redacted excerpt; full excerpt in artifact; logical snapshot remains the verified surrogate]"
            fi
          fi
      - name: Inspect, snapshot, apply reviewed ordered migrations, verify Auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PRODUCTION_APP_URL: https://dealscan-omega.vercel.app
          # Opt-in, idempotent recovery for ledgered files whose markers went
          # missing (whole-file application was partially executed upstream).
          # Re-applies their reviewed statements one by one and only then
          # re-verifies markers; any divergence still blocks the run.
          DEALSCAN_REPAIR_INCONSISTENT: "1"
        run: |
          python -m validation.supabase_handoff --apply \
            --app-url "$PRODUCTION_APP_URL" \
            --report-file data/supabase-handoff.json
      - name: Upload minimized Supabase handoff summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: supabase-handoff-${{ github.run_id }}
          path: |
            pipeline/data/supabase-handoff.json
            data/supabase-schema-backup.sql
            data/supabase-counts-backup.txt
            data/supabase-backup-status.txt
            data/supabase-backup-endpoint.txt
            data/supabase-dsn-diagnosis.json
            data/supabase-backup-error.txt
          if-no-files-found: warn
          retention-days: 7
